# The whole "no login" trick for the public OhmzAI. Full architecture: docs/PUBLIC_INSTANCE.md.
#
# WHAT THIS FILE DOES
# --------------------
# open-webui-public trusts a header (WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-Ohmz-Guest, set in
# ../docker-compose.yml) instead of a password. This file is what sets that header — with
# proxy_set_header, which REPLACES any client-supplied header of the same name, so a request cannot
# forge its own identity by sending X-Ohmz-Guest itself. That substitution is the entire security
# property this file provides; everything else here is plumbing around it.
#
# Two doors:
#   :80  public   — mints a per-browser guest identity, no cookie needed to arrive.
#   :81  admin    — a fixed owner identity, no cookie machinery at all. Bound to
#                   127.0.0.1:4570 by ../docker-compose.yml and DELIBERATELY never given a
#                   Cloudflare route — see docs/PUBLIC_INSTANCE.md. This is how the owner
#                   administers an instance whose login form is disabled
#                   (ENABLE_LOGIN_FORM=false), and how scripts/purge_public_guests.py
#                   authenticates without a password.
#
# ON THE COOKIE BEING A BEARER TOKEN
# -----------------------------------
# ohmzgid is validated by SHAPE only (32 lowercase hex chars) — that check exists to stop a
# malformed cookie value from breaking the email string it gets interpolated into (header/response
# injection via a crafted Cookie), not to prove the server minted it. Whoever holds a given ohmzgid
# value effectively holds that guest's session, same as any other bearer session cookie. Accepted
# deliberately: this is an anonymous chat-only demo instance with no file upload and nothing
# persisted that matters beyond a chat transcript, session cookies clear at browser close, and
# scripts/purge_public_guests.py reaps idle guest accounts server-side regardless.
#
# THE COOKIE-MINTING RACE
# ------------------------
# A page load fires a burst of near-simultaneous requests (the document, favicon, JS chunks, /api/
# config, /api/version, …). If every one of those independently minted its own guest id on a first
# visit, they would race: several throwaway guest accounts get created server-side, and whichever
# response's Set-Cookie the browser happens to apply last is the one that "wins" — not necessarily
# the one any given request actually authenticated as. `location = /` below exists specifically to
# collapse that: on a cookie-less hit to the document root, it mints, sets the cookie, and 302s back
# to itself WITHOUT proxying anything — so the resource burst a real page load triggers never starts
# until the SECOND request, which already carries the real cookie. The fallback in `location /`
# still mints for a cookie-less hit to any other path (a bookmarked deep link, e.g.), because a
# websocket upgrade or a POST can't be redirected the same way; that path is not the multi-request
# burst above; the worst case there is a rare extra throwaway guest, not identity confusion.
#
# nginx resolves proxy_pass hostnames once at config load unless the target is a variable — using
# one here, backed by Docker's embedded DNS, means a restarted open-webui-public (new internal IP)
# is picked up without an nginx reload.
resolver 127.0.0.11 valid=30s;

# Cloudflare Tunnel is the only thing that can reach these ports (both are bound to 127.0.0.1 by
# ../docker-compose.yml), so cf-connecting-ip is trustworthy here — nothing else can spoof it in.
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# Accept an existing cookie only if it is exactly the shape a mint produces; anything else
# (missing, truncated, tampered) is discarded and treated as "no cookie yet".
map $cookie_ohmzgid $gid_ok {
  default               "";
  "~^[0-9a-f]{32}$"     $cookie_ohmzgid;
}

# $request_id is nginx's own per-request random hex id (32 chars) — reused here as the fresh guest
# id when there's no valid cookie yet, so minting needs no extra module.
map $gid_ok $gid {
  ""      $request_id;
  default $gid_ok;
}

# Secure is conditional on genuinely arriving via Cloudflare's TLS-terminated edge, signaled by
# CF-Connecting-IP (only Cloudflare's proxy sets it — same signal $client_ip above already trusts).
# Cloudflare Tunnel and a direct `http://<this-host>:4568` hit are otherwise INDISTINGUISHABLE to
# nginx: both land on the exact same socket as plain HTTP, because Cloudflare always terminates TLS
# at its own edge and connects to this origin over HTTP regardless of what the browser used. A
# hardcoded `Secure` therefore either breaks direct http:// access — the browser silently refuses to
# persist the cookie, which cascades into a 401 "User mismatch" -> re-signin -> new identity loop on
# every subsequent request, reproduced 2026-08-11 testing over plain http://localhost:4568 — or, if
# dropped instead, ships a session cookie unprotected over the connection that actually is exposed
# to the internet. Conditioning on the one signal that's genuinely different fixes both at once.
map $http_cf_connecting_ip $cookie_secure {
  ""      "";
  default "Secure; ";
}

# Only emit Set-Cookie when a fresh id was actually minted (map omits an add_header whose value is
# empty) — a returning guest with a valid cookie gets neither header re-sent.
map $gid_ok $mint_gid {
  ""      "ohmzgid=$gid; Path=/; HttpOnly; ${cookie_secure}SameSite=Lax";
  default "";
}

# Guards a rare edge: a browser that kept OWUI's own `token` cookie from a previous guest identity
# (e.g. only the ohmzgid cookie was cleared by hand) would present a JWT for an email that no longer
# matches the freshly-minted X-Ohmz-Guest header, and get_current_user answers a hard 401 "User
# mismatch. Please sign in again." — expiring the stale token here avoids that round trip.
map $gid_ok $mint_token {
  ""      "token=; Path=/; Max-Age=0";
  default "";
}

map $http_upgrade $conn_upgrade {
  default upgrade;
  ""      close;
}

# Keyed on the real client IP so one guest can't dodge the limit by cycling ohmzgid cookies.
# Scoped to /api/chat/ only (below) — static assets and socket.io frames are not rate-limited here.
limit_req_zone $client_ip zone=owuipublic_chat:10m rate=20r/m;

# A signin storm observed during testing on 2026-08-11 fired ~500 POST /api/v1/auths/signin in 5
# seconds from one browser tab (most likely tangled up with testing over plain http://localhost —
# see docs/PUBLIC_INSTANCE.md — where a Secure cookie's persistence is less predictable than over
# real Cloudflare-terminated https). It self-resolved and only produced 8 duplicate guest rows, not
# hundreds, but nothing bounded it. This does, defense in depth: whatever the trigger — a client
# retry bug, flaky network, or someone deliberately hammering signin — a legitimate visitor signs in
# once, so a tight limit costs a real guest nothing.
limit_req_zone $client_ip zone=owuipublic_signin:10m rate=6r/m;

server {
  # Bound to all interfaces INSIDE this container's own network namespace, not just its loopback —
  # the host-side restriction to 127.0.0.1 is already enforced by `-p 127.0.0.1:4568:80` in
  # ../docker-compose.yml. `listen 127.0.0.1:80` here would bind only the container's internal
  # loopback, which Docker's NAT never delivers published traffic to (it arrives on the container's
  # bridge-assigned address) — verified 2026-08-11: that mistake made every request reset.
  listen 80;
  server_name aipublic.ohmz.cloud;

  # No uploads: the guest instance has USER_PERMISSIONS_CHAT_FILE_UPLOAD=false, but that's a UI
  # affordance, not a boundary — this is the boundary. 1m covers ordinary chat JSON bodies with
  # plenty of headroom and nothing else should ever be posted here.
  client_max_body_size 1m;

  # Chat responses stream token-by-token; buffering would collect the whole response before
  # forwarding it, which reads to the guest as a single delayed lump instead of a live stream.
  proxy_buffering off;

  # See "THE COOKIE-MINTING RACE" above. Bootstrap hop only — never reaches the backend.
  location = / {
    if ($gid_ok = "") {
      # $mint_gid, not a second hardcoded literal — see its definition above the limit_req_zones
      # for why Secure has to be conditional, and keeping one copy is what stops the two from
      # drifting apart the way they did on 2026-08-11.
      add_header Set-Cookie $mint_gid always;
      # Hardcoded https, NOT `return 302 /` (relative). A bare path makes nginx build the
      # Location header from ITS OWN view of the request — $scheme, here — and Cloudflare Tunnel
      # always connects to this origin over plain HTTP even though the browser's own connection to
      # Cloudflare's edge is https. `$scheme` is therefore "http" on every real request, and a
      # relative redirect silently downgrades the browser to http://<host>/ — which the tunnel does
      # not serve on port 80, so the hop just fails. Verified the hard way on 2026-08-11: local
      # testing against this container's port directly (bypassing Cloudflare) never surfaces this,
      # because in that path $scheme genuinely does match the client's own scheme.
      return 302 https://$host/;
    }
    set $upstream http://open-webui-public:8080;
    proxy_pass $upstream;
    include /etc/nginx/conf.d/_guest_proxy.snippet;
  }

  location /ws/ {
    set $upstream http://open-webui-public:8080;
    proxy_pass $upstream;
    include /etc/nginx/conf.d/_guest_proxy.snippet;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_read_timeout 3600s;
  }

  location /api/chat/ {
    limit_req zone=owuipublic_chat burst=5 nodelay;
    set $upstream http://open-webui-public:8080;
    proxy_pass $upstream;
    include /etc/nginx/conf.d/_guest_proxy.snippet;
    proxy_read_timeout 300s;
  }

  # See "A signin storm..." above the limit_req_zone definitions.
  location = /api/v1/auths/signin {
    limit_req zone=owuipublic_signin burst=3 nodelay;
    set $upstream http://open-webui-public:8080;
    proxy_pass $upstream;
    include /etc/nginx/conf.d/_guest_proxy.snippet;
  }

  location / {
    set $upstream http://open-webui-public:8080;
    proxy_pass $upstream;
    include /etc/nginx/conf.d/_guest_proxy.snippet;
  }
}

# Loopback-only, no Cloudflare route — see the file header. Fixed owner identity, no cookie
# machinery: every request through this door is the owner, unconditionally.
server {
  listen 81;
  server_name _;

  client_max_body_size 1m;
  proxy_buffering off;

  location /ws/ {
    set $upstream http://open-webui-public:8080;
    proxy_pass $upstream;
    include /etc/nginx/conf.d/_admin_proxy.snippet;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    set $upstream http://open-webui-public:8080;
    proxy_pass $upstream;
    include /etc/nginx/conf.d/_admin_proxy.snippet;
  }
}
