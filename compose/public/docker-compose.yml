# The public, no-account OhmzAI — a second, disposable OpenWebUI in front of one Ollama model and
# nothing else. Full rationale, bootstrap order and operations: docs/PUBLIC_INSTANCE.md.
#
# WHY A SECOND CONTAINER AT ALL
# ------------------------------
# The private instance (compose/openwebui/run.sh) carries pipes — auto_assistant, photoreal,
# animate_scail — that POST straight to ComfyUI on localhost:8188 from inside the container. Those
# media branches are not gated by any OWUI setting or valve (pipes/auto_assistant.py:6837-6886), so
# "chat only, no image or video" on that instance would be a UI convention, not a boundary. This
# stack is the boundary: a stock, unpatched OWUI build with no pipes deployed to it at all, on a
# bridge network that structurally cannot reach ComfyUI, the hermes gateway, or qdrant.
#
# WHY A SEPARATE COMPOSE PROJECT
# --------------------------------
# `-p owui-public`, kept out of compose/docker-compose.yml on purpose: `docker compose down` in that
# directory (tika/searxng/kokoro/infinity-rerank) must never be able to take this down too, and vice
# versa. Bring it up with ./up.sh, which also handles the one-time secret generation the way
# compose/openwebui/run.sh does for the private instance.
#
# SUBNET IS PINNED, NOT LEFT TO DOCKER
# --------------------------------------
# Verified 2026-08-11: this host already has 15 docker networks occupying 172.17.0.0/16 through
# 172.31.0.0/16 — the entire default IPAM pool above the base network. The only range left in that
# pool is 172.16.0.0/16; Docker's fallback pool after that is 192.168.0.0/16, which COLLIDES with
# the LAN (192.168.40.0/24, this host's own address). An unpinned `docker compose up` here either
# fails outright or, worse, succeeds by handing this network a subnet that already routes to real
# LAN hosts. Pinning 172.16.240.0/24 sidesteps both.
services:
  open-webui-public:
    container_name: open-webui-public
    # Same digest the private instance's fork (compose/openwebui/fork/Dockerfile) builds its FROM
    # from — stock, unpatched. These two digests describe the same OWUI release and MUST move
    # together on an upstream bump, or the private fork's frontend and this backend disagree about
    # what API shape to expect.
    #
    # Deliberately NOT ai-stack/open-webui:task-mode: that fork's Internet/Code/Task buttons drive
    # web search, the code interpreter and the task_mode filter — all off or entirely absent here —
    # so on this instance they would be three controls that render and visibly do nothing.
    image: ghcr.io/open-webui/open-webui@sha256:d04b9ec1c9d5a6f8fb978158e5c7208d31beb2f9d1a27c58dd692dd8cee26f1a
    restart: unless-stopped
    networks:
      - owui-public
    # No published ports at all — reached only through owui-public-gate, on the same network.
    volumes:
      - /volume1/docker/openwebui-public/config:/app/backend/data
    env_file:
      # WEBUI_SECRET_KEY only. Generated by ./up.sh on first run, exactly like
      # compose/openwebui/run.sh does for the private instance's secret.env — never committed.
      - /volume1/docker/openwebui-public/secret.env
    environment:
      # --- Identity: the whole "no login" mechanism -------------------------------------------
      # owui-public-gate injects these three headers with proxy_set_header, which REPLACES any
      # client-supplied header of the same name — a guest cannot forge their own identity by
      # sending X-Ohmz-Guest themselves. auths.py's signin route auto-creates a user for an unseen
      # trusted-header email regardless of ENABLE_SIGNUP, which is what makes ENABLE_SIGNUP=false
      # below coexist with new guests still being able to arrive.
      #
      # signup_handler also promotes user #1 in an EMPTY database to admin, unconditionally — not
      # gated by ENABLE_SIGNUP, ENABLE_LOGIN_FORM or ENABLE_INITIAL_ADMIN_SIGNUP (that flag only
      # gates the unused password-based /signup endpoint; this instance never calls it). Verified
      # the hard way on 2026-08-11: hitting the PUBLIC door (:80) even once — an isolation curl
      # probe, in this case — before the owner ever visits the ADMIN door (:81) hands admin to that
      # random guest instead. Bootstrap order matters: bring the stack up, then hit :81 before
      # anything else ever reaches :80. docs/PUBLIC_INSTANCE.md's bootstrap section says so too;
      # this comment is here because it's exactly the kind of thing a config file's own reader
      # needs to see, not just the ops doc.
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Ohmz-Guest
      WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Ohmz-Guest-Name
      WEBUI_AUTH_TRUSTED_GROUPS_HEADER: X-Ohmz-Guest-Groups
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "false"
      # Frontend-only: hides the email/password fields and the sign-up toggle on /auth. Backend
      # enforcement is ENABLE_SIGNUP above and ENABLE_PASSWORD_AUTH, which stays at its default
      # (true) — the trusted-header signin path in auths.py checks ENABLE_PASSWORD_AUTH first and
      # 403s if it's false, BEFORE it ever looks at the trusted header. Guests never see this form:
      # the auth page auto-redirects on load whenever features.auth_trusted_header is true.
      ENABLE_LOGIN_FORM: "false"

      # --- Backend: Ollama only, nothing else reachable -----------------------------------------
      # 172.16.240.1 is owui-public-ollama's socat pinhole (network_mode: host on the HOST side,
      # listening only on this bridge's gateway address) — not Ollama itself, which stays bound to
      # 127.0.0.1:11434 and is otherwise unreachable from a bridged container. Punching a hole to
      # Ollama specifically, rather than running this container with --network host, is what keeps
      # ComfyUI (:8188, no auth), the hermes gateway (:8642) and qdrant (:6333) out of reach.
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://172.16.240.1:11435
      ENABLE_OPENAI_API: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"

      # --- Media: off at every layer that exists ------------------------------------------------
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_IMAGE_EDIT: "false"
      ENABLE_IMAGE_PROMPT_GENERATION: "false"

      # --- Everything else that isn't "chat" ------------------------------------------------------
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_CHANNELS: "false"
      ENABLE_NOTES: "false"
      ENABLE_MEMORIES: "false"
      ENABLE_CALENDAR: "false"
      ENABLE_AUTOMATIONS: "false"
      ENABLE_API_KEYS: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_USER_WEBHOOKS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      # Folders are a chat-organizing feature with nothing to organize for a session that never
      # outlives the browser tab — hides the sidebar's FOLDERS section (its own permission flag is
      # below; both are checked with AND, so either alone would do it, this is belt-and-braces).
      ENABLE_FOLDERS: "false"

      # --- No task model is configured, so don't let anything try to invoke one -----------------
      # The private instance's own notes (docs/openwebui-config-snapshot.md) record that a task
      # model which is configured but not visible/granted silently falls back to answering with the
      # CHAT model instead — i.e. a title-generation request would burn a real completion on
      # whatever the guest is talking to. Simplest fix: never ask for one.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"

      # --- Per-user permission defaults: belt-and-braces under the feature flags above -----------
      # These are the DEFAULT permissions new users (i.e. every guest) get. Redundant with the
      # ENABLE_* flags above for most of these — kept anyway because the ENABLE_* flags are
      # instance-wide kill switches while these are what the admin panel actually shows as "off" per
      # user, and the two have drifted independently upstream before.
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_STT: "false"
      USER_PERMISSIONS_CHAT_CALL: "false"
      # The chat-header Controls panel (temperature, system prompt override, …) — nothing here
      # persists past the session, and it's real backend surface, not just a hidden button; the
      # header still shows two icons this permission doesn't reach (the "..." chat-context menu,
      # gated on chat.id existing rather than any permission, and the account menu, gated on nothing
      # at all) — those two are hidden visually via compose/public/guest-ui.css instead.
      USER_PERMISSIONS_CHAT_CONTROLS: "false"
      # The Temporary Chat toggle exists to opt OUT of history for one conversation on an instance
      # that otherwise keeps it — meaningless when nothing survives the browser tab either way, and
      # confusing UI for a guest to have to reason about.
      USER_PERMISSIONS_CHAT_TEMPORARY: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: "false"
      USER_PERMISSIONS_FEATURES_NOTES: "false"
      USER_PERMISSIONS_FEATURES_CHANNELS: "false"
      USER_PERMISSIONS_FEATURES_MEMORIES: "false"
      USER_PERMISSIONS_FEATURES_CALENDAR: "false"
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      USER_PERMISSIONS_FEATURES_FOLDERS: "false"
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "false"

      # --- Presentation ---------------------------------------------------------------------------
      # ENABLE_PERSISTENT_CONFIG=false (below) means an admin-UI setting change does not survive a
      # restart, so anything the guest experience depends on has to be an env var, not a click:
      # which model is selected by default, which group new users land in, and the banner
      # disclosing this is a guest session. GUEST_GROUP_ID is filled in by ./up.sh's .env after
      # bootstrap step 3 creates the Guests group — see docs/PUBLIC_INSTANCE.md.
      WEBUI_URL: https://aipublic.ohmz.cloud
      DEFAULT_MODELS: hermes-genesis:apex-compact
      # Deliberately NOT DEFAULT_PINNED_MODELS: pinning is what puts a "MODELS" section in the
      # sidebar (Sidebar.svelte's condition is `$models.length > 0 && (settings.pinnedModels.length
      # > 0 || $config.default_pinned_models)`) — there is exactly one model for a guest to see
      # already, in the picker; a pinned-shortcut section under it was redundant chrome, not a
      # feature, and DEFAULT_MODELS above still selects it as the default on a fresh chat.
      DEFAULT_GROUP_ID: ${GUEST_GROUP_ID:-}
      WEBUI_BANNERS: >-
        [{"id":"guest","type":"info","title":"","content":"You're chatting as a guest — nothing is saved and no account is created.","dismissible":true,"timestamp":0}]
      # Left unset, same reasoning as compose/openwebui/run.sh: env.py appends " (Open WebUI)" to
      # any custom WEBUI_NAME, so the OhmzAI brand comes from branding/loader.js instead (applied
      # with OWUI_CONTAINER=open-webui-public ./branding/apply.sh — see docs/PUBLIC_INSTANCE.md).

      # --- Hygiene, matched to compose/openwebui/run.sh ------------------------------------------
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      WEB_LOADER_ENGINE: safe_web
      ENABLE_RAG_LOCAL_WEB_FETCH: "false"
      UVICORN_WORKERS: "1"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"

      # --- Lock the posture above into place -------------------------------------------------------
      # Every row above is re-read from THIS FILE on every boot rather than drifting in a 300 MB
      # sqlite blob, so the public instance's entire security posture lives in git. Cost: settings
      # changed in the admin UI (other than model visibility / access grants, which are DB tables,
      # not config rows, and are unaffected) do not persist across a restart.
      ENABLE_PERSISTENT_CONFIG: "false"
    healthcheck:
      # curl, not wget: verified 2026-08-11 the stock (non-CUDA-slim) image has no wget.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # The whole "no login" trick: mints a per-browser guest identity and injects it as a header nginx
  # sets itself (unspoofable), so open-webui-public's trusted-header auth never shows a form. Full
  # config: compose/public/nginx/guest-gate.conf.
  owui-public-gate:
    image: nginx:alpine
    container_name: owui-public-gate
    restart: unless-stopped
    networks:
      - owui-public
    ports:
      # :80 — the public door, bound to every interface, matching how compose/openwebui/run.sh
      # exposes the PRIVATE instance's :4567 (0.0.0.0, LAN-reachable). Cloudflare Tunnel would reach
      # this either way — cloudflared is a process on this same host and always dials `localhost`,
      # so 127.0.0.1-only was never actually a barrier to it — this widening is for parity with 4567
      # (any device on the LAN can reach it directly too, not just through the tunnel). The content
      # behind it is meant to be public regardless, so this isn't new exposure in the way it would
      # be for a private endpoint. Cloudflare Tunnel points aipublic.ohmz.cloud
      # here (dashboard-only config, see docs/PUBLIC_INSTANCE.md — nothing in this repo records that
      # mapping).
      - "4568:80"
      # :81 — the admin door: a fixed owner identity, no cookie machinery. How you administer an
      # instance whose login form is disabled, and how scripts/purge_public_guests.py authenticates
      # without a password. MUST stay 127.0.0.1-only — unlike :80 this is not meant to be public,
      # there is no password behind it, and it must never be given a Cloudflare route either.
      - "127.0.0.1:4570:81"
    volumes:
      # The whole directory, not just guest-gate.conf: it `include`s _guest_proxy.snippet and
      # _admin_proxy.snippet by path, and those two are named with a non-.conf extension
      # specifically so nginx's own `include conf.d/*.conf` wildcard does not also load them at
      # http scope — see the comment at the top of each file.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - open-webui-public
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Ollama is a HOST systemd unit bound to 127.0.0.1:11434 only (verified 2026-08-11) — a bridged
  # container has no route to it. This is a one-service pinhole through that wall: it forwards
  # 172.16.240.1:11435 (this bridge's gateway address, reachable from every container on it) to
  # Ollama and nothing else. The alternative, running open-webui-public with --network host, was
  # rejected because it would hand the public container ComfyUI (:8188, no auth) and the hermes
  # gateway (:8642) along with Ollama — see the isolation tests in tests/test_public_instance.py.
  owui-public-ollama:
    image: alpine/socat
    container_name: owui-public-ollama
    restart: unless-stopped
    network_mode: host
    command: >-
      TCP-LISTEN:11435,bind=172.16.240.1,fork,reuseaddr
      TCP:127.0.0.1:11434
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

networks:
  owui-public:
    ipam:
      config:
        - subnet: 172.16.240.0/24
          gateway: 172.16.240.1
