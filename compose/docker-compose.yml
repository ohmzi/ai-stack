# Support services for the Open WebUI stack.
#
# open-webui itself runs with NetworkMode=host, so it reaches these at localhost:<port>.
# That is why every service here publishes to a HOST port and why the OWUI config must use
# http://localhost:<port> — the shipped defaults (http://tika:9998, http://docling:5001) are
# Docker-DNS names that cannot resolve from a host-networked container.
#
# PORT CHOICES ARE DELIBERATE. On this host :8000 is tunarr and :8080 is already taken by another
# python service. OWUI's own defaults collide with both:
#   rag.mineru_api_url        defaults to http://localhost:8000  -> tunarr
#   rag.paddleocr_vl_base_url defaults to http://localhost:8080  -> occupied
# Verified free when this file was written: 9998, 5001, 8081, 8888.
#
#   docker compose -f compose/docker-compose.yml up -d

services:
  # Document extraction. 0 VRAM. Bundles Tesseract (eng/fra/deu/ita/spa/jpn), which is what fixes
  # the .msg / .doc / legacy .ppt hard ingest errors.
  tika:
    image: apache/tika:3.3.0.0-full
    container_name: tika
    restart: unless-stopped
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Web search. 0 VRAM.
  # settings.yml MUST enable the json format — upstream ships [html] only and webapp.py returns 404
  # for format=json otherwise. That is the single most common SearXNG-with-OWUI failure.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # Text-to-speech, OpenAI-compatible (POST /v1/audio/speech). CPU build deliberately: this card is
  # already contended by ComfyUI renders and the coder tenant, and Kokoro is fast enough on CPU.
  # OWUI is then configured with audio.tts.engine='openai' pointed at this base URL.
  #
  # Note the existing ebook2audiobook container bundles piper-tts/coqui-tts but is Gradio-only —
  # POST /v1/audio/speech returns 404 there, so it cannot serve OWUI without a shim.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.6.0
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8880"
    environment:
      - USE_GPU=false
      - DEVICE=cpu
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # Cross-encoder reranker, Cohere-schema, on CPU.
  #
  # This is NOT an optional quality add-on. Reading the running OWUI source
  # (retrieval/utils.py:1702-1735): when rag.reranking_model is empty, RerankCompressor takes the
  # RRF-fused hybrid candidates, RE-EMBEDS them with the ordinary embedding model, re-sorts by plain
  # cosine and truncates. The BM25 half of hybrid search is discarded at the final ranking step. So
  # with hybrid on and no reranker, hybrid was buying candidate recall and then throwing the fusion
  # away. A reranker is what makes enable_hybrid_search mean anything.
  #
  # CPU deliberately: 0 VRAM on a card holding an 18.4 GB coder, and reranking ~20 short passages is
  # a small job for 24 idle cores. The GPU image is 4.76 GB; this one is 0.75 GB.
  #
  # OWUI side: rag.reranking_engine="external", rag.external_reranker_url="http://localhost:7997/rerank".
  # Infinity implements Cohere's schema, which is the shape OWUI expects — note HF TEI does NOT
  # (it returns a bare array rather than {results:[...]}) and is therefore incompatible.
  infinity-rerank:
    image: michaelf34/infinity:0.0.77-cpu
    container_name: infinity-rerank
    restart: unless-stopped
    ports:
      - "127.0.0.1:7997:7997"
    volumes:
      - ./infinity-cache:/app/.cache
    command: >
      v2
      --model-id BAAI/bge-reranker-v2-m3
      --engine torch
      --device cpu
      --port 7997
      --batch-size 8
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # Self-hosted push notifications (phone alerts from hermes background jobs).
  # Reachable on loopback and on the Tailscale interface ONLY — never the LAN.
  # deny-all + accounts: nothing can publish or subscribe without credentials.
  # The tailscale-IP bind can race tailscaled at boot; unless-stopped retries
  # until the interface exists.
  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    container_name: ntfy
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:8300:80"
      - "100.101.5.51:8300:80"
    environment:
      - TZ=America/New_York
      # MUST match the URL clients subscribe with — iOS APNs routing keys on it.
      # notify.ohmz.cloud is the user's cloudflared tunnel to 127.0.0.1:8300.
      - NTFY_BASE_URL=https://notify.ohmz.cloud
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_LOGIN=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      # iOS-only: APNs wake relay. iOS kills background sockets, so without this a
      # self-hosted server cannot wake the phone — the app only shows messages when
      # foregrounded. The relay sends a CONTENTLESS poll ping (message id + topic)
      # through ntfy.sh; the phone then fetches the actual message from THIS server
      # over the tailnet. Message content never leaves the box. Android ignores this.
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    volumes:
      - ./ntfy:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
