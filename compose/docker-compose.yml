# Support services for the Open WebUI stack.
#
# open-webui itself runs with NetworkMode=host, so it reaches these at localhost:<port>.
# That is why every service here publishes to a HOST port and why the OWUI config must use
# http://localhost:<port> — the shipped defaults (http://tika:9998, http://docling:5001) are
# Docker-DNS names that cannot resolve from a host-networked container.
#
# PORT CHOICES ARE DELIBERATE. On this host :8000 is tunarr and :8080 is already taken by another
# python service. OWUI's own defaults collide with both:
#   rag.mineru_api_url        defaults to http://localhost:8000  -> tunarr
#   rag.paddleocr_vl_base_url defaults to http://localhost:8080  -> occupied
# Verified free when this file was written: 9998, 5001, 8081, 8888, 8889.
#
#   docker compose -f compose/docker-compose.yml up -d

services:
  # Document extraction. 0 VRAM. Bundles Tesseract (eng/fra/deu/ita/spa/jpn), which is what fixes
  # the .msg / .doc / legacy .ppt hard ingest errors.
  tika:
    image: apache/tika:3.3.0.0-full
    container_name: tika
    restart: unless-stopped
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Web search. 0 VRAM.
  # settings.yml MUST enable the json format — upstream ships [html] only and webapp.py returns 404
  # for format=json otherwise. That is the single most common SearXNG-with-OWUI failure.
  searxng:
    # Pinned to a digest, not :latest. This is the stack's own search dependency — an upstream
    # push that changes the JSON shape or the engine roster degrades web search SILENTLY: the
    # assistant answers from training data and still looks grounded. Bump deliberately, and
    # re-run tests/test_websearch.py after.  (digest captured 2026-08-01, image built 2026-07-25)
    image: searxng/searxng@sha256:3bc6ae0e872ecd4b003e97e9cb58ec0fb56b02d46ad97ea67e2fa4ff2e8ff759
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # Web search for BACKGROUND MONITORS only (scripts/web_search.py). 0 VRAM.
  #
  # Separate from `searxng` above on purpose. That instance serves OpenWebUI chat and its roster is
  # tuned for constant interactive load; this one serves discovery (~1 query per monitor lifetime)
  # and can afford engines that CAPTCHA under sustained use. Adding google to the CHAT roster would
  # spend chat's engine budget on monitors — and a degraded chat search fails SILENTLY, with the
  # model answering from training data. Engine limits are per source IP, so the two rosters are kept
  # almost disjoint: google/startpage/brave/qwant are hermes-only. See
  # compose/searxng-hermes/settings.yml for the per-engine reasoning and the measured arithmetic.
  #
  # SAME pinned digest as `searxng`, deliberately: the JSON shape is this layer's API
  # (unresponsive_engines as [name, reason] ARRAYS, results[].score, results[].engines[],
  # infoboxes[] with url=None) and so are the engine NAME strings. One image means one shape to
  # test, one bump to review, and zero extra disk (identical layers). Bump both together and re-run
  # tests/test_websearch.py AND tests/test_web_search.py.
  #
  # FIRST-RUN NOTE: create ./searxng-hermes/settings.yml BEFORE the first `up`. The entrypoint
  # chowns /etc/searxng to nobody:nogroup, after which ohmz can edit files in place but cannot
  # create or rename them in that directory (vim's write-backup-rename dance will fail).
  #
  #   docker compose -f compose/docker-compose.yml up -d searxng-hermes
  #
  # Name the service on the command line. A bare `up -d` would recreate the chat container too,
  # and "chat search was not touched" is the property this whole split exists to guarantee.
  searxng-hermes:
    image: searxng/searxng@sha256:3bc6ae0e872ecd4b003e97e9cb58ec0fb56b02d46ad97ea67e2fa4ff2e8ff759
    container_name: searxng-hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    volumes:
      - ./searxng-hermes:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8889/
      # The same secret as the chat instance: it signs this instance's own cookies and nothing
      # else, both are loopback-bound, and a second .env variable is a second thing to forget.
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      # 1 worker, not 4: this instance handles roughly one request per ten minutes. ~130 MB RSS.
      - UWSGI_WORKERS=1
      - UWSGI_THREADS=2
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # Text-to-speech, OpenAI-compatible (POST /v1/audio/speech). CPU build deliberately: this card is
  # already contended by ComfyUI renders and the coder tenant, and Kokoro is fast enough on CPU.
  # OWUI is then configured with audio.tts.engine='openai' pointed at this base URL.
  #
  # Note the existing ebook2audiobook container bundles piper-tts/coqui-tts but is Gradio-only —
  # POST /v1/audio/speech returns 404 there, so it cannot serve OWUI without a shim.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.6.0
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8880"
    environment:
      - USE_GPU=false
      - DEVICE=cpu
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # Cross-encoder reranker, Cohere-schema, on CPU.
  #
  # This is NOT an optional quality add-on. Reading the running OWUI source
  # (retrieval/utils.py:1702-1735): when rag.reranking_model is empty, RerankCompressor takes the
  # RRF-fused hybrid candidates, RE-EMBEDS them with the ordinary embedding model, re-sorts by plain
  # cosine and truncates. The BM25 half of hybrid search is discarded at the final ranking step. So
  # with hybrid on and no reranker, hybrid was buying candidate recall and then throwing the fusion
  # away. A reranker is what makes enable_hybrid_search mean anything.
  #
  # CPU deliberately: 0 VRAM on a card holding an 18.4 GB coder, and reranking ~20 short passages is
  # a small job for 24 idle cores. The GPU image is 4.76 GB; this one is 0.75 GB.
  #
  # OWUI side: rag.reranking_engine="external", rag.external_reranker_url="http://localhost:7997/rerank".
  # Infinity implements Cohere's schema, which is the shape OWUI expects — note HF TEI does NOT
  # (it returns a bare array rather than {results:[...]}) and is therefore incompatible.
  infinity-rerank:
    image: michaelf34/infinity:0.0.77-cpu
    container_name: infinity-rerank
    restart: unless-stopped
    ports:
      - "127.0.0.1:7997:7997"
    volumes:
      - ./infinity-cache:/app/.cache
    command: >
      v2
      --model-id BAAI/bge-reranker-v2-m3
      --engine torch
      --device cpu
      --port 7997
      --batch-size 8
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
