# SearXNG settings for server-to-server use by Open WebUI.
#
# Three things break virtually every guide; all three are handled here:
#
#  1. search.formats MUST include `json`. Upstream default is [html] only, and webapp.py returns
#     404 for format=json otherwise. This is the #1 cause of "web search does nothing".
#  2. server.limiter MUST be false. The deprecated searxng-docker template set it true, which is
#     why so many setups get 403/429 on server-to-server queries.
#  3. The searxng-docker repo itself is superseded — it now contains only a LICENSE and a README
#     saying so. This file is hand-written per docs.searxng.org instead.
#
# Note: OWUI 0.10.2 no longer needs the legacy `<query>` placeholder in the query URL; searxng.py
# actively strips any query string from it.

# Whitelist the engine set instead of inheriting SearXNG's full default roster.
#
# WHY: with the full roster, every query fans out to dozens of upstream engines. An audit that ran
# ~60 queries in 10 minutes got google cse, duckduckgo, startpage AND brave rate-limited or
# CAPTCHA-blocked simultaneously, degrading results to bing-only boilerplate. `server.limiter: false`
# does not help — those limits are imposed upstream, not here.
#
# A small curated set means each engine sees far fewer requests, so normal interactive use stays well
# under their thresholds. Note a CAPTCHA block lasts ~3600 s, not the 180 s of a plain rate-limit.
#
# Health check:
#   curl -s 'localhost:8888/search?q=test&format=json' \
#     | python3 -c "import json,sys; print(json.load(sys.stdin)['unresponsive_engines'])"
use_default_settings:
  engines:
    keep_only:
      - duckduckgo      # good general coverage; CAPTCHAs only under sustained load
      - bing            # the most tolerant of server-to-server use from this IP
      - mojeek          # independent index, no API key, rarely rate-limits
      - wikipedia       # note: populates infoboxes[], not results[]
      - wikidata

general:
  debug: false
  instance_name: "searxng"
  # No public instance — donation/contact links are noise here.
  donation_url: false
  contact_url: false

server:
  # Generated per-install. Not a secret that protects anything reachable off-host (the port is
  # bound to 127.0.0.1), but SearXNG refuses to start without one.
  secret_key: "rotated-out-of-git-2026-07-29-use-SEARXNG_SECRET-env"  # real value in compose/.env (untracked)
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # THE important line — without json here, OWUI gets a 404 and web search silently does nothing.
  formats:
    - html
    - json

ui:
  static_use_hash: true

# BOTH directives are required and they do different jobs:
#   use_default_settings.engines.keep_only (top of file) RESTRICTS which engines exist at all.
#   this `engines:` list FLIPS THE disabled FLAG on the ones that ship disabled by default.
#
# keep_only alone is not enough, and it fails quietly: bing and mojeek ship `disabled: true`
# upstream, so keeping them still left them switched off. Verified via /config — with keep_only alone
# only duckduckgo, wikipedia and wikidata were enabled, i.e. one real web engine and no fallback.
#
# Verify after any change:
#   curl -s localhost:8888/config | python3 -c \
#     "import json,sys; [print(e['name'], e.get('enabled')) for e in json.load(sys.stdin)['engines']]"
#
# Deliberately NOT kept: google cse, startpage and brave. All three rate-limited or CAPTCHA-blocked
# this IP during the audit ("too many requests" / CAPTCHA). Re-add one at a time and watch
# unresponsive_engines if you want broader coverage.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
