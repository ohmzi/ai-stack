# SearXNG settings for the BACKGROUND MONITOR path (scripts/web_search.py -> price_search.py).
#
# WHY A SECOND INSTANCE instead of editing compose/searxng/settings.yml:
#
#  1. The two consumers want OPPOSITE rosters. The chat instance is tuned for interactive load
#     (~1 query per question, all day), so it needs engines that tolerate constant use. This one
#     serves discovery (~1 query per monitor LIFETIME) and can therefore afford engines that
#     CAPTCHA under sustained load, because it never sustains any.
#  2. The roster IS the fan-out, so the client never sends `engines=`. That matters: an unknown
#     `engines=` value is SILENTLY IGNORED and falls back to SearXNG's FULL default roster
#     (dozens of engines). One typo would be the fastest way to CAPTCHA this IP, with no error
#     anywhere. Keeping the roster in this file makes that typo unreachable.
#  3. compose/searxng/settings.yml must stay byte-for-byte identical. An OpenWebUI chat-search
#     regression is INVISIBLE — the model just answers from training data and still looks
#     grounded — and tests/test_websearch.py is the only thing that catches it. A test in
#     tests/test_web_search.py pins that file's sha256 so it can only change deliberately.
#  4. Engine rate limits are per SOURCE IP, not per container, so an engine on BOTH rosters has
#     its budget spent by both consumers. The rosters are therefore kept almost disjoint: google,
#     startpage, brave and qwant are hermes-only, so a monitor can never CAPTCHA an engine that
#     chat depends on.
#
# Measured constraints this file respects (docs/CAPABILITY_UPGRADE_PLAN.md:427-458):
#   ~50-60 queries per engine per 10 min CAPTCHA'd google/duckduckgo/startpage/brave together.
#   A CAPTCHA lasts ~3600 s; a plain rate-limit ~180 s; probing at expiry RE-TRIGGERS it.
#   server.limiter does nothing about any of that — the limits are upstream, not local.
# Measured load on this instance: <=1 query per unresolved monitor per 600 s, and zero for a
# monitor whose page is healthy. Three unresolved monitors is ~3 q/10 min per engine, ~6% of the
# break point. There is deliberately NO canary against this port: a canary would spend google's
# budget on monitoring, and the whole point of this instance is that its budget belongs to
# monitors. Poll GET /config instead — it costs zero upstream queries.
#
# Verify after any change, BOTH commands, in this order:
#   docker logs --tail 40 searxng-hermes    # an unknown engine NAME in `engines:` fails LOUDLY here
#   curl -s localhost:8889/config | python3 -c \
#     "import json,sys; [print(e['name'], e.get('enabled')) for e in json.load(sys.stdin)['engines']]"
# Expect exactly the six names below, all True. A MISSING name means keep_only dropped it
# silently — fix this file and web_search.ENGINE_ORDER together (a drift test pins them equal).
use_default_settings:
  engines:
    keep_only:
      - google        # best long-tail recall for product and fare pages; also the highest CAPTCHA
                      # risk here, and safe only because it is absent from the chat roster, so
                      # chat can never spend its budget and it can never spend chat's.
                      # It exists in the image's defaults (its settings.yml:1217, and note that is
                      # a DIFFERENT engine from `google cse` at :1236, which is the keyed API the
                      # chat roster's comment says was dropped). See the `engines:` block below for
                      # why it is deliberately NOT repeated there.
      - brave         # genuinely independent crawl (not a Bing/Google reseller), keyless, its own
                      # limit bucket. Measured 2026-08-07: INTERMITTENT, not dead — "too many
                      # requests (suspended_time=180)" on one query and healthy on the next, where
                      # it supplied the only relevant rows for a fare query while bing returned
                      # payday-loan sites. A 180 s suspension is weather; keeping it is what makes
                      # the fan-out worth having at all on this IP.
      - mojeek        # independent crawler, measured on this host never to rate-limit
                      # (compose/searxng/settings.yml:33). This is the FLOOR: it is what stops a
                      # fan-out ever returning zero results, which is what keeps the
                      # outage-vs-fruitless conjunction in web_search.search() harmless
      - bing          # measured "the most tolerant of server-to-server use from this IP"
                      # (compose/searxng/settings.yml:32) and the one engine that survived the
                      # audit's 50-query burst. Second floor engine.
      # NOT kept, and the first two are a MEASURED reversal of this file's first version:
      #   startpage — CAPTCHA on the very first query this instance ever issued, and on every one
      #     since: "get_sc_code: got redirected to .../sp/captcha (suspended_time=3600)". An hour
      #     per attempt, from this IP, on sight.
      #   qwant — same, every query: "CAPTCHA (suspended_time=0)". suspended_time=0 means SearXNG
      #     retries it immediately next time, so it never stops costing a request.
      #     Both were on the first roster on the theory that a hermes-only instance queries too
      #     rarely to trip a limit. That theory is dead: this IP is blocked before any load builds
      #     up. A blocked engine is not free — it costs an upstream request and holds the whole
      #     fan-out until it answers or times out.
      #   wikipedia / wikidata — they populate infoboxes[] with url=None and title="", never
      #     results[]. Excluding them removes that hazard from this instance structurally.
      #     (web_search._usable() still guards it, because SEARXNG_URL can be pointed at :8888.)
      #   duckduckgo — its budget is already spent by chat AND by scripts/search_canary.py, whose
      #     comment records "DuckDuckGo CAPTCHAs constantly".

general:
  debug: false
  instance_name: "searxng-hermes"
  # No public instance — donation/contact links are noise here.
  donation_url: false
  contact_url: false

server:
  # Overridden at runtime by SEARXNG_SECRET (compose/.env). A non-empty value is still required
  # here: SearXNG refuses to start without one. It protects nothing reachable off-host — this
  # port is bound to 127.0.0.1, same as the chat instance.
  secret_key: "rotated-out-of-git-use-SEARXNG_SECRET-env"
  limiter: false      # server-to-server. A `true` here is 403/429 on every query.
  image_proxy: false
  method: "GET"       # our client GETs /search?...; SearXNG's POST-only default would 405 it

search:
  safe_search: 0
  autocomplete: ""
  # en-CA, not en: every retailer in price_search.DEFAULT_PREFER is a .ca domain, and the one
  # live search monitor on this box resolved to amazon.COM. This costs zero extra queries.
  # If the container logs reject this value, fall back to "en" — verify at bring-up.
  default_lang: "en-CA"
  # THE required line — without json here, webapp.py returns 404 for format=json and search
  # silently does nothing. html is kept so a bad result set can be eyeballed at
  # http://127.0.0.1:8889.
  formats:
    - html
    - json

outgoing:
  # A six-engine fan-out finishes when its slowest engine does. Bound that well under the
  # client's SEARCH_TIMEOUT (20 s) so one stalled engine cannot eat the job's 180 s terminal
  # budget: a slow engine then lands in unresponsive_engines instead, which is a signal
  # web_search.search() already handles.
  request_timeout: 5.0
  max_request_timeout: 10.0

ui:
  static_use_hash: true

# BOTH directives are required and they do different jobs, exactly as documented in
# compose/searxng/settings.yml:64-78:
#   use_default_settings.engines.keep_only (above) RESTRICTS which engines exist at all.
#   this `engines:` list FLIPS THE disabled FLAG on the ones that ship disabled upstream
#   (bing and mojeek do — measured on this host; keep_only alone left them switched off).
#
# ONLY the engines that measurably need the flag flipped. The first version of this file listed
# every engine here on the theory that a name in keep_only which does not exist is dropped
# SILENTLY, while a name HERE with no engine module would fail loudly at container start — so
# listing all of them would convert a silent typo into a visible one.
#
# THAT WAS WRONG, measured 2026-08-07. With `google` in both lists the container started cleanly,
# exit 0, nothing in `docker logs`, and /config returned FIVE engines with google simply absent.
# So a bad or redundant entry here is silent too, and worse: it appears to be what removed google,
# which unlike bing and mojeek is NOT disabled upstream and therefore needs no flip at all. An
# entry here for an engine that does not need one seems to shadow the real definition with a
# module-less stub.
#
# The rule that survives: flip ONLY what ships disabled, and verify the roster against /config
# after every change, because nothing here fails loudly.
engines:
  - name: mojeek
    disabled: false
  - name: bing
    disabled: false
